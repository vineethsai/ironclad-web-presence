<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:#0A0A0A;color:#fff;font-family:Inter,sans-serif;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(51,204,102,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(51,204,102,.07) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 70% 40%,#000 20%,transparent 75%)}
  .glow{position:absolute;width:640px;height:640px;right:-160px;top:-220px;background:radial-gradient(circle,rgba(51,204,102,.22),transparent 65%)}
  .wrap{position:absolute;inset:0;padding:72px 80px;display:flex;flex-direction:column}
  .kicker{font-family:'Roboto Mono',monospace;font-size:24px;letter-spacing:.18em;color:#33CC66;text-transform:uppercase;display:flex;align-items:center;gap:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:#33CC66;box-shadow:0 0 12px #33CC66}
  h1{font-size:84px;line-height:1.02;font-weight:800;margin:36px 0 0;letter-spacing:-.02em}
  p{font-size:32px;line-height:1.4;color:#c9d1cc;margin:28px 0 0;max-width:900px}
  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
  .url{font-family:'Roboto Mono',monospace;font-size:26px;color:#fff}
  .tags{display:flex;gap:12px}
  .tag{font-family:'Roboto Mono',monospace;font-size:20px;color:#5CE68A;border:1px solid rgba(51,204,102,.4);background:rgba(51,204,102,.08);padding:8px 14px;border-radius:8px}
  svg{position:absolute;right:88px;top:84px}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#33CC66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 18px rgba(51,204,102,.55))"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
<div class="wrap">
  <div class="kicker"><span class="dot"></span>AI Security Research · Cisco</div>
  <h1>Vineeth Sai Narajala</h1>
  <p>Securing AI agents: agent identity, MCP and tool security, and AI vulnerability scoring.</p>
  <div class="foot">
    <div class="url">vineethsai.com</div>
    <div class="tags"><span class="tag">Agent Name Service</span><span class="tag">OWASP AIVSS</span><span class="tag">MCP</span></div>
  </div>
</div>
</body></html>
